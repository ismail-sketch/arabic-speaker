<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرّب المحادثة — Тренажёр разговорного арабского (MSA)</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #212c42; --accent: #2dd4a7;
    --text: #e8edf5; --muted: #93a0b5; --err: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header { width: 100%; max-width: 820px; padding: 20px 16px 6px; }
  h1 { margin: 0; font-size: 1.5rem; }
  h1 .ar { color: var(--accent); }
  .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  main { width: 100%; max-width: 820px; padding: 12px 16px 32px; flex: 1; }

  #settings { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  #settings label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
  #settings input, #settings select {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #33415c;
    background: var(--panel2); color: var(--text); font-size: 1rem;
  }
  #settings input[type="checkbox"] { width: auto; padding: 0; margin: 0; accent-color: var(--accent); }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch.inline { font-size: .85rem; color: var(--muted); margin: 0; }
  .switch input { width: auto; }
  .hint { font-size: .78rem; color: var(--muted); margin-top: 4px; }
  button {
    background: var(--accent); color: #06281f; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid #33415c; }
  button:disabled { opacity: .45; cursor: default; }

  #chat {
    background: var(--panel); border-radius: 12px; padding: 16px;
    height: 46vh; min-height: 300px; overflow-y: auto; margin-bottom: 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.55; }
  .msg.bot { background: var(--panel2); align-self: flex-start; }
  .msg.user { background: #1d3b4a; align-self: flex-end; }
  .msg .ar { font-size: 1.15rem; direction: rtl; text-align: right; font-family: "Segoe UI", "Traditional Arabic", serif; }
  .msg .tr { color: var(--muted); font-size: .82rem; margin-top: 6px; }
  .msg .corr { color: #ffd479; font-size: .85rem; margin-top: 6px; border-top: 1px solid #33415c; padding-top: 6px; white-space: pre-line; line-height: 1.5; }
  .msg .corr.ok { color: var(--accent); }
  .status { color: var(--muted); font-style: italic; font-size: .85rem; align-self: center; }
  .status.good { color: var(--accent); }

  #controls { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #micBtn {
    width: 84px; height: 84px; border-radius: 50%; font-size: 2rem; display: flex;
    align-items: center; justify-content: center; padding: 0;
  }
  #micBtn.listening { background: #ff6b6b; color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,107,.5);} 50% { box-shadow: 0 0 0 16px rgba(255,107,107,0);} }
  #level { color: var(--muted); font-size: .9rem; width: 100%; text-align: center; min-height: 1.3em; margin-top: 6px; }
  #textRow { display: flex; gap: 8px; margin-top: 12px; }
  #textIn {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #33415c;
    background: var(--panel2); color: var(--text); font-size: 1rem;
    font-family: "Segoe UI", "Traditional Arabic", serif;
  }
  .hidden { display: none !important; }
  .errbox { background: #3a1f1f; border: 1px solid var(--err); color: var(--err);
    padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: .9rem; }
  .meta { font-size: .72rem; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1><span class="ar">مدرّب المحادثة العربية</span> — говорящий тренажёр</h1>
  <div class="sub">Литературный арабский (фусха) · говорите в микрофон — тренажёр слушает и отвечает голосом</div>
</header>
<main>
  <section id="settings">
    <h2 style="margin:0 0 6px; font-size:1.1rem;">Настройки</h2>

    <label for="level">Ваш уровень</label>
    <select id="level">
      <option value="beginner">Начинающий — простые фразы, медленно</option>
      <option value="intermediate" selected>Средний</option>
      <option value="advanced">Продвинутый</option>
    </select>

    <label for="topic">Тема разговора</label>
    <select id="topic">
      <option value="free" selected>Свободная беседа</option>
      <option value="cafe">В кафе / ресторане</option>
      <option value="market">На рынке / покупки</option>
      <option value="travel">Путешествия / такси / отель</option>
      <option value="work">Работа и учёба</option>
      <option value="daily">Повседневная жизнь, семья</option>
    </select>

    <label for="voice">Голос (арабский TTS)</label>
    <select id="voice"></select>

    <label class="switch" for="tashkeelSet">
      <input type="checkbox" id="tashkeelSet">
      Огласовки (харакаты) в арабском тексте
    </label>

    <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
      <button id="startBtn">Начать разговор</button>
      <button id="diagBtn" class="secondary">Проверить микрофон</button>
    </div>
    <div class="meta" id="diagOut"></div>
    <div class="meta">Модель: gc/gemini-2.5-flash (через AnyModel)</div>
  </section>

  <div id="err" class="errbox hidden"></div>

  <section id="chatSection" class="hidden">
    <div id="chat"></div>
    <div id="controls">
      <button id="micBtn" title="Нажмите и говорите">🎙</button>
      <button id="sendVoiceBtn" class="secondary" disabled title="Отправить распознанную речь">Готово</button>
      <button id="stopBtn" class="secondary">Стоп-речь</button>
      <button id="endBtn" class="secondary">Завершить</button>
      <label class="switch inline" title="Показывать огласовки в арабском тексте">
        <input type="checkbox" id="tashkeelChat"> огласовки
      </label>
      <div id="level"></div>
    </div>
    <div id="textRow">
      <input id="textIn" placeholder="Или введите фразу по-арабски (можно без огласовок) и нажмите Enter…" />
      <button id="sendText" class="secondary">Отправить</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), errBox = $('err');
let messages = [];           // история для API (формат OpenAI)
let recognition = null, listening = false;
let voices = [];

/* ---------- settings persistence ---------- */
$('level').value = localStorage.getItem('ar_level') || 'beginner';
$('topic').value = localStorage.getItem('ar_topic') || 'free';
$('level').onchange = () => localStorage.setItem('ar_level', $('level').value);
$('topic').onchange = () => localStorage.setItem('ar_topic', $('topic').value);

/* ---------- огласовки (харакаты) ---------- */
let tashkeel = localStorage.getItem('ar_tashkeel') === 'on';
function syncTashkeelUI() {
  $('tashkeelSet').checked = tashkeel;
  $('tashkeelChat').checked = tashkeel;
}
function setTashkeel(v) {
  tashkeel = !!v;
  localStorage.setItem('ar_tashkeel', tashkeel ? 'on' : 'off');
  syncTashkeelUI();
}
$('tashkeelSet').onchange = e => setTashkeel(e.target.checked);
$('tashkeelChat').onchange = e => setTashkeel(e.target.checked);
syncTashkeelUI();

function err(msg, ok) {
  errBox.textContent = msg;
  errBox.classList.remove('hidden');
  errBox.style.borderColor = ok ? '#2dd4a7' : '';
  errBox.style.color = ok ? '#2dd4a7' : '';
  if (ok) setTimeout(() => errBox.classList.add('hidden'), 2500);
}

/* ---------- TTS voices ---------- */
function loadVoices() {
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
  const sel = $('voice');
  sel.innerHTML = '';
  if (!voices.length) { sel.innerHTML = '<option>Арабские голоса не найдены в системе</option>'; return; }
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = `${v.name} (${v.lang})`;
    sel.appendChild(o);
  });
  const saved = localStorage.getItem('ar_voice');
  if (saved && voices[saved]) sel.value = saved;
  sel.onchange = () => localStorage.setItem('ar_voice', sel.value);
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text, cb) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  const v = voices[$('voice').value];
  if (v) u.voice = v;
  u.rate = $('level').value === 'beginner' ? 0.8 : 0.95;
  u.onend = u.onerror = () => { if (cb) cb(); };
  speechSynthesis.speak(u);
}

/* ---------- STT (push-to-talk: говорим в своём темпе) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const AR_LANGS = ['ar-SA', 'ar', 'ar-EG', 'ar-AE', 'ar-XA', 'ar-JO', 'ar-LB'];

let sessionActive = false;   // идёт ли сессия записи
let base = '';               // текст, зафиксированный в предыдущих запусках движка
let local = '';              // полный текст текущего запуска (финальный + промежуточный)
let curLang = null;          // текущая арабская локаль
let engine = null;           // активный SpeechRecognition
let engineSeq = 0;           // номер поколения движка (защита от «поздних» событий)
let restartTimer = null;
let noSpeechCount = 0;

function joinText(a, b) { return [a, b].map(s => (s || '').trim()).filter(Boolean).join(' '); }
function currentText() { return joinText(base, local); }
function commitLocal() { base = joinText(base, local); local = ''; }

async function pickArabicLang() {
  if (!SR || !SR.available) return AR_LANGS[0];
  for (const l of AR_LANGS) {
    try {
      const st = await SR.available({ langs: [l] });
      if (st === 'available') return l;
    } catch (e) { /* ignore */ }
  }
  return null;
}

function renderTranscript() {
  const shown = currentText();
  $('level').textContent = shown
    ? '🎤 ' + shown + '  ·  нажмите 🎙 или «Готово», чтобы отправить'
    : '🎤 Слушаю… говорите в своём темпе (паузы можно делать). Нажмите 🎙, когда закончите.';
  const btn = $('sendVoiceBtn');
  if (btn) btn.disabled = !shown;
}

function safeRestart() {
  if (!sessionActive) return;
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => { if (sessionActive) startEngine(); }, 250);
}

function startEngine() {
  if (!sessionActive) return;
  const myId = ++engineSeq;      // помечаем этот движок как актуальный
  local = '';                    // каждый запуск движка копит свой локальный буфер
  const r = new SR();
  r.lang = curLang;
  r.interimResults = true;
  r.continuous = true;           // не обрывать на паузах
  r.onstart = () => { listening = true; };
  r.onresult = e => {
    if (myId !== engineSeq) return;   // события от старого движка игнорируем
    noSpeechCount = 0;
    // Берём ВЕСЬ текст текущего движка (и финальный, и промежуточный),
    // чтобы ничего не терялось на паузах.
    let full = '';
    for (let i = 0; i < e.results.length; i++) full += e.results[i][0].transcript;
    local = full;
    renderTranscript();
  };
  r.onerror = e => {
    if (myId !== engineSeq) return;
    if (e.error === 'language-not-supported') {
      const idx = AR_LANGS.indexOf(curLang);
      const next = AR_LANGS[(idx + 1) % AR_LANGS.length];
      if (next !== curLang) { curLang = next; safeRestart(); return; }
      stopSession(false);
      err('В этом браузере нет арабского распознавания. Введите фразу в поле ниже.');
      return;
    }
    if (e.error === 'not-allowed') { stopSession(false); err('Нет доступа к микрофону. Разрешите его в настройках браузера.'); return; }
    if (e.error === 'no-speech') noSpeechCount++;
    // 'aborted'/'network' — просто перезапустим через onend
  };
  r.onend = () => {
    if (myId !== engineSeq) return;   // старый движок уже неактуален
    listening = false;
    commitLocal();                 // сохраняем всё, что успело распознаться, ДО перезапуска
    if (!sessionActive) return;    // пользователь нажал «стоп» — отправка идёт в stopSession
    safeRestart();                 // НЕ отправляем на паузе — просто продолжаем слушать
  };
  engine = r;
  try { r.start(); } catch (e) { safeRestart(); }
}

async function startSession() {
  speechSynthesis.cancel();
  if (!SR) { err('Браузер не поддерживает распознавание речи. Используйте Chrome/Edge или введите фразу в поле ниже.'); return; }
  const lang = await pickArabicLang();
  if (!lang) {
    err('В этом браузере нет арабского распознавания речи. Введите фразу в поле ниже или откройте тренажёр в Chrome/Edge.');
    return;
  }
  curLang = lang; base = ''; local = ''; noSpeechCount = 0; sessionActive = true;
  $('micBtn').classList.add('listening');
  $('micBtn').title = 'Идёт запись — нажмите, чтобы отправить';
  renderTranscript();
  startEngine();
}

function stopSession(send) {
  const wasActive = sessionActive;
  sessionActive = false;
  clearTimeout(restartTimer);
  try { engine && engine.stop(); } catch (e) { /* ignore */ }
  listening = false;
  $('micBtn').classList.remove('listening');
  $('micBtn').title = 'Нажмите и говорите';
  const finish = () => {
    commitLocal();                 // включить всё, что успело прийти
    const text = currentText();
    base = ''; local = '';
    engineSeq++;                   // после отправки игнорируем любые «хвостовые» события
    $('level').textContent = '';
    const btn = $('sendVoiceBtn');
    if (btn) btn.disabled = true;
    if (send && text) sendUser(text);
  };
  // Небольшая задержка, чтобы браузер успел финализировать последние слова.
  if (wasActive && send) setTimeout(finish, 600);
  else finish();
}

$('micBtn').onclick = () => {
  if (sessionActive) stopSession(true);   // повторное нажатие = «готово, отправь»
  else startSession();
};
$('sendVoiceBtn').onclick = () => stopSession(true);

/* ---------- chat UI ---------- */
function addMsg(role, ar, tr, corr, ok) {
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'assistant' ? 'bot' : 'user');
  d.innerHTML = `<div class="ar"></div>` +
    (tr ? `<div class="tr"></div>` : '') +
    (corr ? `<div class="corr"></div>` : '');
  d.querySelector('.ar').textContent = ar;
  if (tr) d.querySelector('.tr').textContent = 'Перевод: ' + tr;
  if (corr) {
    const c = d.querySelector('.corr');
    c.textContent = (ok ? '✓ ' : '✎ ') + corr;
    if (ok) c.classList.add('ok');
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function status(t, cls) { const s = document.createElement('div'); s.className = 'status ' + (cls || ''); s.textContent = t; chat.appendChild(s); chat.scrollTop = chat.scrollHeight; return s; }

/* ---------- разбор ответа модели ---------- */
const HARAKAT_RE = /[\u064B-\u065F\u0670\u06D6-\u06ED]/g;
function stripHarakat(s) { return s ? s.replace(HARAKAT_RE, '') : s; }

function parseReply(reply) {
  let ar = (reply.match(/AR:\s*([\s\S]*?)(?:RU:|FIX:|$)/) || [])[1]?.trim() || reply;
  const ru = (reply.match(/RU:\s*([\s\S]*?)(?:FIX:|$)/) || [])[1]?.trim();
  let fixRaw = (reply.match(/FIX:\s*([\s\S]*)/) || [])[1]?.trim() || '';
  // Страховка: если огласовки выключены, убираем харакаты даже если модель их добавила.
  if (!tashkeel) { ar = stripHarakat(ar); fixRaw = stripHarakat(fixRaw); }
  const ok = /^отлично/i.test(fixRaw);
  return { ar, ru, fix: fixRaw || null, ok };
}

/* ---------- запрос к локальному прокси (AnyModel → DeepSeek) ---------- */
async function callModel() {
  const resp = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      messages: [{ role: 'system', content: systemPrompt() }, ...messages],
      temperature: 0.5,
      max_tokens: 700,
    }),
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error?.message || data.error || ('Ошибка API ' + resp.status));
  return data.choices?.[0]?.message?.content || '';
}

function systemPrompt() {
  const lv = {
    beginner: 'очень начинающий (A0-A1): используй только простейшие слова и короткие фразы в настоящем времени, говори медленно и понятно',
    intermediate: 'средний (A2-B1): обычная повседневная лексика, простые конструкции',
    advanced: 'продвинутый (B2+): свободная естественная речь'
  }[$('level').value];
  const tp = {
    free: 'свободная беседа на любую тему по выбору ученика',
    cafe: 'ситуация: ты официант в кафе в Каире, ученик — посетитель',
    market: 'ситуация: ты продавец на базаре, ученик покупает товары, торгуйся',
    travel: 'ситуация: путешествие — аэропорт, отель, такси; играй роль таксиста/портье',
    work: 'тема: работа и учёба, собеседования, университет',
    daily: 'тема: повседневная жизнь, семья, хобби, распорядок дня'
  }[$('topic').value];
  return `Ты — преподаватель литературного арабского языка (фусха) и дружелюбный собеседник. Уровень ученика: ${lv}. Ситуация: ${tp}.

Твоя задача — вести живой диалог И обязательно проверять ПОСЛЕДНЮЮ фразу ученика.

Структура ответа строго (ровно эти метки, в этом порядке, без markdown-звёздочек):
AR: <твой ответ по-арабски: 1–3 коротких предложения и встречный вопрос>
RU: <перевод твоего ответа на русский>
FIX: <разбор ошибок в последней фразе ученика>

Правила для FIX:
- Разбирай ВСЕ реальные ошибки ученика, каждую с новой строки, в формате:
  • Грамматика: «неверно» → «верно» — короткое пояснение по-русски.
  • Лексика: «неудачное слово» → «лучше ...» — почему.
  • Порядок слов / предлоги / артикль / род / число / падеж — так же, если применимо.
- Пояснения — по-русски, коротко и понятно. Указывай только проблемные места, не переписывай всю фразу, если она верна.
- Не выдумывай ошибок: разбирай только то, что действительно неверно.
- Если ошибок нет — напиши ровно: Отлично!
- Если ученик говорит/пишет не по-арабски, вежливо предложи арабский вариант его фразы.

Никакого текста вне меток AR/RU/FIX.
Пиши арабский текст ТОЛЬКО арабскими буквами и арабской пунктуацией — никогда не вставляй латинские буквы, цифры или транслитерацию внутрь арабской фразы.
${tashkeel
    ? 'ОГЛАСОВКИ ВКЛЮЧЕНЫ: пиши все арабские слова (в AR и в примерах внутри FIX) с ПОЛНОЙ огласовкой — фатха, кясра, дамма, сукун, шадда, танвин.'
    : 'ОГЛАСОВКИ ВЫКЛЮЧЕНЫ: пиши арабский текст БЕЗ огласовок (без харакат), только буквы.'}`;
}

async function sendUser(text) {
  $('level').textContent = '';
  addMsg('user', text);
  messages.push({ role: 'user', content: text });
  const s = status('Думаю…');
  const t0 = performance.now();
  try {
    const reply = await callModel();
    s.remove();
    messages.push({ role: 'assistant', content: reply });
    const p = parseReply(reply);
    addMsg('assistant', p.ar, p.ru, p.fix, p.ok);
    const dt = ((performance.now() - t0) / 1000).toFixed(1);
    const m = status(`готово за ${dt} c`, 'good');
    setTimeout(() => m.remove(), 1500);
    speak(p.ar);
  } catch (e) {
    s.remove();
    err(e.message);
  }
}

/* ---------- start / stop ---------- */
$('startBtn').onclick = () => {
  stopSession(false);
  messages = []; chat.innerHTML = ''; errBox.classList.add('hidden');
  $('settings').classList.add('hidden');
  $('chatSection').classList.remove('hidden');
  messages.push({ role: 'user', content: 'Начни разговор: поздоровайся и задай первый вопрос по ситуации.' });
  sendFirst();
};

async function sendFirst() {
  const s = status('Думаю…');
  try {
    const reply = await callModel();
    s.remove();
    messages.push({ role: 'assistant', content: reply });
    const p = parseReply(reply);
    addMsg('assistant', p.ar, p.ru, null);
    speak(p.ar);
  } catch (e) { s.remove(); err(e.message); }
}

$('stopBtn').onclick = () => { speechSynthesis.cancel(); stopSession(false); };
$('endBtn').onclick = () => {
  speechSynthesis.cancel(); stopSession(false);
  $('chatSection').classList.add('hidden');
  $('settings').classList.remove('hidden');
  messages = [];
};

/* ---------- текстовый ввод (гарантированная альтернатива микрофону) ---------- */
function sendTyped() {
  const v = $('textIn').value.trim();
  if (!v) return;
  $('textIn').value = '';
  sendUser(v);
}
$('sendText').onclick = sendTyped;
$('textIn').addEventListener('keydown', e => { if (e.key === 'Enter') sendTyped(); });

/* ---------- диагностика распознавания ---------- */
$('diagBtn').onclick = async () => {
  const out = $('diagOut');
  if (!SR) { out.textContent = 'Распознавание речи: НЕ поддерживается этим браузером.'; return; }
  out.textContent = 'Проверяю поддержку арабского распознавания…';
  if (!SR.available) { out.textContent = 'Браузер поддерживает распознавание, но не умеет проверять языки (старая версия).'; return; }
  const parts = [];
  for (const l of AR_LANGS) {
    try { parts.push(l + ' — ' + await SR.available({ langs: [l] })); }
    catch (e) { parts.push(l + ' — ошибка'); }
  }
  out.textContent = 'Поддержка арабского: ' + parts.join('; ');
};

if (navigator.mediaDevices) navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {});
</script>
